name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Site checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.5.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Build static site
        run: npm run build

  cv:
    name: CV checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Render and compile CV PDFs
        uses: docker/build-push-action@v7
        with:
          context: .
          target: cv
          outputs: type=local,dest=public/cv
          cache-from: type=gha,scope=cv
          cache-to: type=gha,mode=max,scope=cv

      - name: Upload CV PDFs
        uses: actions/upload-artifact@v5
        with:
          name: cv
          path: public/cv/*.pdf
          if-no-files-found: error

  helm:
    name: Helm checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: v3.18.4

      - name: Lint chart
        run: helm lint deploy/helm/leonid-sh

      - name: Render production manifests
        run: >-
          helm template leonid-sh deploy/helm/leonid-sh
          --namespace leonid-sh
          --set gateway.enabled=true
          --set image.repository=cr.yandex/example/leonid-sh

  publish-image:
    name: Publish commit image
    if: github.event_name == 'push'
    needs:
      - site
      - cv
      - helm
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: cr.yandex/${{ vars.YC_REGISTRY_ID }}/${{ vars.YC_REGISTRY_REPOSITORY }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

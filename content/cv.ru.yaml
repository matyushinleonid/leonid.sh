projects:
  - slug: k8s
    name: k8s.leonid.sh
    description: >-
      Персональная Kubernetes-платформа в Yandex Cloud. Облачные ресурсы —
      кластер, сеть, managed PostgreSQL, registry, DNS, хранилище секретов —
      описаны как код в Terraform и разворачиваются Ansible; всё, что работает
      поверх, доставляется Argo CD из Git. Платформенный слой включает Envoy
      Gateway с cert-manager и ExternalDNS для ingress и сертификатов, External
      Secrets для доступов и self-hosted Prometheus, Grafana и Loki для
      мониторинга, алертинга и логов. На ней живут остальные проекты отсюда.
    href: https://github.com/matyushinleonid/k8s.leonid.sh
    argocdApp: argocd
    status: running
    technologies: [Kubernetes, Terraform, Ansible, Argo CD, Envoy, Prometheus]

  - slug: sein
    name: sein-zum-tode
    description: >-
      Telegram-бот, предназначенный для того, чтобы помочь пользователю пережить
      перспективу смерти как явления, которое произойдёт и, более того, **уже
      происходит** непосредственно с ним. Пользователю предлагается ответить на
      ряд вопросов, после чего средствами LLM будет приблизительно оценена
      оставшаяся продолжительность его жизни. Основную ценность представляет
      ежедневно уменьшающееся число оставшихся дней, которое бот будет
      регулярно присылать пользователю. Каждый диалог — workflow в Temporal,
      PostgreSQL — основная база, а Redis хранит чувствительные ответы лишь
      временно, из соображений приватности.
    href: https://github.com/matyushinleonid/sein-zum-tode
    argocdApp: sein-zum-tode
    status: running
    technologies: [Python, aiogram, Temporal, OpenAI API, PostgreSQL, Redis]
    extraLink:
      label: "@SeinZumTodeBot"
      href: https://t.me/SeinZumTodeBot

  - slug: minecraft
    name: minecraft.leonid.sh
    description: >-
      «Киркой по голове» — Minecraft-сервер, живущий в персональном
      Kubernetes-кластере: мир хранится на персистентном облачном диске, релизы
      приезжают через Argo CD. Рендерер BlueMap публикует карту мира, которую
      можно открыть в браузере.
    href: https://github.com/matyushinleonid/k8s.leonid.sh/tree/main/argocd/minecraft
    argocdApp: minecraft
    status: running
    technologies: [Kubernetes, Helm, Argo CD]
    extraLink:
      label: map.minecraft.leonid.sh
      href: https://map.minecraft.leonid.sh


          Kubernetes-оператора; также был добавлен механизм, отключающий
          автоматическую замену при аномальном поведении мониторинга. Система выполнила более
          1 000 замен дисков в 4+ регионах для YDB и внутреннего S3-совместимого object
          storage. Расширил gRPC API оператора, провёл миграции CRD, согласовал
          сценарии отказов и очерёдность регионального запуска с SRE и
          менеджерами, настроил мониторинг и алертинг.
        technologies: [Go, Kubebuilder]
      - title: "HWaaS: автоматизированный деплой"
        description: >-
          Спроектировал и реализовал автоматическую сборку и разворачивание сервиса
          HWaaS, который поставляется как набор тесно связанных
          Kubernetes-ресурсов. Внедрил GitOps-подход, благодаря которому релизы
          стали обратимыми, быстрее и прозрачнее для остальных разработчиков.
        technologies:
          [Kubernetes, TeamCity, Timoni, Helm, Argo CD, Argo Workflows]

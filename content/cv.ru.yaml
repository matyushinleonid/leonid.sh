          Разработал REST API как отдельных сервисов, так и пайплайна целиком.
        technologies: [Python, Airflow, FastAPI, MongoDB, AWS SQS, AWS S3]
      - title: "Dubformer: инфраструктура"
        description: >-
          Построил мониторинг и алертинг, отображающий поведение и нагрузку

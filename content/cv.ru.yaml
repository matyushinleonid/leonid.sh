    period: авг 2023 – ноя 2025
    location: Амстердам, Нидерланды
    highlights:
      - title: "HWaaS: автоматизация замены дисков"
        description: >-
          Спроектировал и реализовал инфраструктуру, полностью
          автоматизировавшую замену неисправных дисков (в частности, создание

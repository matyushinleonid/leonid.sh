experience:
  - company: Nebius
    role: Software Engineer
    period: Aug 2023 – Nov 2025
    location: Amsterdam, Netherlands
    highlights:
      - title: "HWaaS: Disk Replacement Automation"
        description: >-
          Designed and implemented infrastructure that fully automated
          failed-disk replacement, in particular the creation of Jira tickets for
          data-center engineers. I built the solution as part of a Kubernetes
          operator and added a mechanism that disables automatic replacement when
          monitoring behaves anomalously. The system has performed 1,000+
          disk replacements across 4+ regions for YDB and an in-house S3-compatible
          object storage. Extended the operator’s gRPC API, performed CRD
          migrations, agreed failure scopes and regional rollout order with SREs
          and managers, and set up monitoring and alerting.
        technologies: [Go, Kubebuilder]
      - title: "HWaaS: Automated Deployment"
        description: >-
          Designed and implemented an automated Kubernetes build and deployment
          process for the HWaaS service, which ships as a set of tightly coupled
          Kubernetes resources. Adopted GitOps delivery so releases became
          reversible, faster, and transparent to other developers.
        technologies:
          [Kubernetes, TeamCity, Timoni, Helm, Argo CD, Argo Workflows]
      - title: "Dubformer: Media Processing Backend"
        description: >-
          Designed and implemented machine translation and text-to-speech
          microservices and integrated them into the automatic video translation
          pipeline. Developed REST APIs for individual services and for the
          pipeline as a whole.
        technologies: [Python, Airflow, FastAPI, MongoDB, AWS SQS, AWS S3]
      - title: "Dubformer: Infrastructure Engineering"
        description: >-
          Built monitoring and alerting that exposed backend behavior and load
          through dashboards and enabled rapid incident response through
          messenger notifications. Implemented CI/CD pipelines and reduced the
          total build and test time from 60 to 10 minutes.
        technologies: [Docker, GitHub Actions, Grafana, Prometheus]


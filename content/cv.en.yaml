projects:
  - slug: k8s
    name: k8s.leonid.sh
    description: >-
      A personal Kubernetes platform on Yandex Cloud. Cloud resources —
      cluster, network, managed PostgreSQL, registry, DNS, secret storage — are
      declared as code in Terraform and bootstrapped with Ansible; every
      workload on top is delivered by Argo CD from Git. The platform layer
      carries Envoy Gateway with cert-manager and ExternalDNS for ingress and
      certificates, External Secrets for credentials, and self-hosted Prometheus,
      Grafana, and Loki for monitoring, alerting, and logs. It hosts the rest of
      the projects here.
    href: https://github.com/matyushinleonid/k8s.leonid.sh
    argocdApp: argocd
    status: running
    technologies: [Kubernetes, Terraform, Ansible, Argo CD, Envoy, Prometheus]

  - slug: sein
    name: sein-zum-tode
    description: >-
      A Telegram bot intended to help users confront the prospect of death as
      something that will happen and, moreover, **is already happening** to
      them. The user is asked a series of questions, after which an LLM
      estimates roughly how much of their life is left. The value of it is the
      daily shrinking number of remaining days, which the bot keeps sending.
      Each conversation runs as a Temporal
      workflow, PostgreSQL is the main database, and Redis keeps the sensitive
      answers only temporarily, for privacy.
    href: https://github.com/matyushinleonid/sein-zum-tode
    argocdApp: sein-zum-tode
    status: running
    technologies: [Python, aiogram, Temporal, OpenAI API, PostgreSQL, Redis]
    extraLink:
      label: "@SeinZumTodeBot"
      href: https://t.me/SeinZumTodeBot

  - slug: minecraft
    name: minecraft.leonid.sh
    description: >-
      «Киркой по голове», a Minecraft server running on the personal
      Kubernetes cluster with its world on a persistent
      cloud disk and its releases delivered by Argo CD. A BlueMap renderer
      publishes a browsable map of the world.
    href: https://github.com/matyushinleonid/k8s.leonid.sh/tree/main/argocd/minecraft
    argocdApp: minecraft
    status: running
    technologies: [Kubernetes, Helm, Argo CD]
    extraLink:
      label: map.minecraft.leonid.sh
      href: https://map.minecraft.leonid.sh


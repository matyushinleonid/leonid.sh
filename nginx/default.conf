map $cookie_locale $locale_choice {
    default  "";
    en       "en";
    ru       "ru";
}

map $http_accept_language $header_choice {
    default  "en";
    ~*^ru    "ru";
}

map $locale_choice$header_choice $root_redirect {
    default  "";
    "ru"     "/ru/";
    "ruen"   "/ru/";
    "ruru"   "/ru/";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Onion-Location "http://leonideoyh3d5l7mewj5tvfawu4eznjpmwqisk6njpijywgy22lvtjad.onion$request_uri" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    location = /en/ {
        return 301 /;
    }

    location = /en {
        return 301 /;
    }

    location = / {
        if ($root_redirect) {
            add_header Vary "Accept-Language, Cookie" always;
            return 302 $root_redirect;
        }
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Onion-Location "http://leonideoyh3d5l7mewj5tvfawu4eznjpmwqisk6njpijywgy22lvtjad.onion$request_uri" always;
        add_header Vary "Accept-Language, Cookie" always;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /_astro/ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Onion-Location "http://leonideoyh3d5l7mewj5tvfawu4eznjpmwqisk6njpijywgy22lvtjad.onion$request_uri" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Onion-Location "http://leonideoyh3d5l7mewj5tvfawu4eznjpmwqisk6njpijywgy22lvtjad.onion$request_uri" always;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ~* \.html$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Onion-Location "http://leonideoyh3d5l7mewj5tvfawu4eznjpmwqisk6njpijywgy22lvtjad.onion$request_uri" always;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}

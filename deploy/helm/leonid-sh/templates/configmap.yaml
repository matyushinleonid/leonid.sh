{{- if .Values.design }}
{{- $allowed := list "atlas" "bento" "luna" "crt" "ceefax" "teletext" "vhs" "web1" "zine" "guestbook" }}
{{- if not (has .Values.design $allowed) }}
{{- fail (printf "design must be one of %s, got %q" (join ", " $allowed) .Values.design) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "leonid-sh.fullname" . }}-design
  labels:
    {{- include "leonid-sh.labels" . | nindent 4 }}
data:
  design.js: |
    window.leonidDesign = {{ .Values.design | quote }};
{{- end }}

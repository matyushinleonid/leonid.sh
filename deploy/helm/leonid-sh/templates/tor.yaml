{{- if .Values.tor.enabled }}
{{- $fullname := include "leonid-sh.fullname" . }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $fullname }}-tor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "leonid-sh.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.tor.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: yc-lockbox
    kind: ClusterSecretStore
  target:
    name: {{ $fullname }}-tor
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        torrc: |
          SocksPort 0
          DataDirectory /var/lib/tor/data
          HiddenServiceDir /var/lib/tor/hs
          HiddenServiceVersion 3
          HiddenServicePort 80 {{ $fullname }}:{{ .Values.service.port }}
          {{- if .Values.tor.socks5.host }}
          Socks5Proxy {{ .Values.tor.socks5.host }}:{{ .Values.tor.socks5.port }}
          Socks5ProxyUsername {{ `{{ .username }}` }}
          Socks5ProxyPassword {{ `{{ .password }}` }}
          {{- end }}
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.tor.externalSecret.lockboxSecretId | quote }}
        property: {{ .Values.tor.externalSecret.socks5UsernameProperty | quote }}
        decodingStrategy: None
    - secretKey: password
      remoteRef:
        key: {{ .Values.tor.externalSecret.lockboxSecretId | quote }}
        property: {{ .Values.tor.externalSecret.socks5PasswordProperty | quote }}
        decodingStrategy: None
{{- if .Values.tor.externalSecret.lockboxSecretId }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.tor.keySecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "leonid-sh.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.tor.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: yc-lockbox
    kind: ClusterSecretStore
  target:
    name: {{ .Values.tor.keySecret }}
    creationPolicy: Owner
  data:
    - secretKey: hs_ed25519_secret_key
      remoteRef:
        key: {{ .Values.tor.externalSecret.lockboxSecretId | quote }}
        property: hs_ed25519_secret_key
        decodingStrategy: Base64
    - secretKey: hs_ed25519_public_key
      remoteRef:
        key: {{ .Values.tor.externalSecret.lockboxSecretId | quote }}
        property: hs_ed25519_public_key
        decodingStrategy: Base64
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-tor
  labels:
    {{- include "leonid-sh.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "leonid-sh.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: tor
  template:
    metadata:
      annotations:
        checksum/torrc: {{ printf "%s|%s|%v" .Values.tor.onionAddress .Values.tor.socks5.host .Values.tor.socks5.port | sha256sum }}
      labels:
        {{- include "leonid-sh.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: tor
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: onion-key
          image: "{{ .Values.tor.image.repository }}:{{ .Values.tor.image.tag }}"
          imagePullPolicy: {{ .Values.tor.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command:
            - sh
            - -c
            - |
              mkdir -p /var/lib/tor/hs /var/lib/tor/data
              cp /onion-key/hs_ed25519_secret_key /onion-key/hs_ed25519_public_key /var/lib/tor/hs/
              chmod 700 /var/lib/tor/hs
              chmod 600 /var/lib/tor/hs/hs_ed25519_secret_key /var/lib/tor/hs/hs_ed25519_public_key
          volumeMounts:
            - name: tor-state
              mountPath: /var/lib/tor
            - name: onion-key
              mountPath: /onion-key
              readOnly: true
          resources:
            {{- toYaml .Values.tor.resources | nindent 12 }}
      containers:
        - name: tor
          image: "{{ .Values.tor.image.repository }}:{{ .Values.tor.image.tag }}"
          imagePullPolicy: {{ .Values.tor.image.pullPolicy }}
          command: ["tor", "-f", "/etc/tor/torrc"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tor-state
              mountPath: /var/lib/tor
            - name: torrc
              mountPath: /etc/tor/torrc
              subPath: torrc
              readOnly: true
          resources:
            {{- toYaml .Values.tor.resources | nindent 12 }}
      volumes:
        - name: tor-state
          emptyDir:
            sizeLimit: {{ .Values.tor.stateSizeLimit }}
        - name: torrc
          secret:
            secretName: {{ $fullname }}-tor
            defaultMode: 0440
        - name: onion-key
          secret:
            secretName: {{ .Values.tor.keySecret | quote }}
            defaultMode: 0440
{{- end }}

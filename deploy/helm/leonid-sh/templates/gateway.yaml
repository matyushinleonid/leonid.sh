{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "leonid-sh.fullname" . }}-public-dns
  labels:
    {{- include "leonid-sh.labels" . | nindent 4 }}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.gateway.host | quote }}
    external-dns.alpha.kubernetes.io/target: {{ .Values.gateway.dnsTarget | quote }}
spec:
  type: ExternalName
  externalName: {{ .Values.gateway.dnsTarget | quote }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: {{ include "leonid-sh.fullname" . }}
  labels:
    {{- include "leonid-sh.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.gateway.clusterIssuer | quote }}
spec:
  parentRef:
    name: {{ .Values.gateway.parent.name | quote }}
    namespace: {{ .Values.gateway.parent.namespace | quote }}
  listeners:
    - name: https
      hostname: {{ .Values.gateway.host | quote }}
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ include "leonid-sh.fullname" . }}-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "leonid-sh.fullname" . }}
  labels:
    {{- include "leonid-sh.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "leonid-sh.fullname" . }}
      kind: ListenerSet
      sectionName: https
  hostnames:
    - {{ .Values.gateway.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "leonid-sh.fullname" . }}
          port: {{ .Values.service.port }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "leonid-sh.fullname" . }}-http-redirect
  labels:
    {{- include "leonid-sh.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.parent.name | quote }}
      namespace: {{ .Values.gateway.parent.namespace | quote }}
      sectionName: {{ .Values.gateway.parent.httpSectionName | quote }}
  hostnames:
    - {{ .Values.gateway.host | quote }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}

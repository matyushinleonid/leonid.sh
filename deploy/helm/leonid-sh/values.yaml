replicaCount: 2

image:
  repository: leonid-sh
  pullPolicy: IfNotPresent
  tag: latest
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

gemini:
  enabled: false
  hostname: leonid.sh
  port: 1965
  certSecret: leonid-sh-gemini-cert
  externalSecret:
    refreshInterval: 15m
    lockboxSecretId: ""
  image:
    repository: ghcr.io/mbrubeck/agate
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi

tor:
  enabled: false
  onionAddress: ""
  keySecret: leonid-sh-onion-key
  socks5:
    host: ""
    port: 32768
  externalSecret:
    refreshInterval: 15m
    lockboxSecretId: ""
    socks5UsernameProperty: socks5_proxy_username
    socks5PasswordProperty: socks5_proxy_password
  image:
    repository: osminogin/tor-simple
    tag: 0.4.9.11
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

gateway:
  enabled: false
  host: home.leonid.sh
  dnsTarget: gateway.leonid.sh
  clusterIssuer: yc-clusterissuer
  parent:
    name: public
    namespace: envoy-gateway-system
    httpSectionName: http

resources:
  requests:
    cpu: 10m
    memory: 24Mi
  limits:
    memory: 64Mi

probes:
  readiness:
    initialDelaySeconds: 2
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}

topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway
